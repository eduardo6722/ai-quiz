openapi: 3.1.0
info:
  title: AI Quiz Generator — Phase 6 observability headers
  version: 0.0.0
  description: >
    Additive header and two error codes on existing routes. Quiz JSON bodies
    are unchanged from Phases 2–3.
servers:
  - url: http://localhost:3001
    description: Local API
paths:
  /v1/quizzes:
    post:
      operationId: createQuiz
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "201":
          description: Ready quiz identity
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
        "429":
          description: Create-quiz rate limit
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                code: REQUEST_RATE_LIMITED
                message: too many quiz creates, try again shortly
        "503":
          description: Create-quiz concurrency limit
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                code: GENERATION_CONCURRENCY_LIMIT
                message: generation is busy, try again shortly
  /health:
    get:
      operationId: getLiveness
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Process liveness (no database, model, or tracer)
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
  /ready:
    get:
      operationId: getReadiness
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Database reachable (tracing keys not required)
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
        "503":
          description: Database not reachable
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
components:
  parameters:
    RequestId:
      name: x-request-id
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[\\x21-\\x7E]{8,128}$"
  headers:
    RequestId:
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    ErrorBody:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
