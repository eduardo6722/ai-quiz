# Production-shaped stack (multi-stage images, no bind mounts).
# Development watch-mode remains compose.yml + Dockerfile.dev.
# Volume ai_quiz_prod_pgdata is intentionally separate from ai_quiz_pgdata.

services:
  db:
    image: postgres:16-alpine
    container_name: ai-quiz-prod-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_quiz
    volumes:
      - ai_quiz_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ai_quiz']
      interval: 5s
      timeout: 5s
      retries: 10

  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    container_name: ai-quiz-prod-migrate
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_quiz?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/ai_quiz?schema=public
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    container_name: ai-quiz-prod-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_quiz?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/ai_quiz?schema=public
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    container_name: ai-quiz-prod-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy

volumes:
  ai_quiz_prod_pgdata:
